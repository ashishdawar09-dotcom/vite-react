name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Type-check, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+ required: @supabase/realtime-js needs native WebSocket
          # (Node 20 lacks it and would need the "ws" polyfill). Also matches
          # the local dev environment (Node 22.16) so CI catches the same things.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        env:
          # Same build-time stubs as the Build step — supabase.ts throws at
          # module-import time if these are missing, which aborts vitest
          # before it can run notifications.test.ts.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-stub-key
          VITE_ADMIN_EMAILS: ci@example.com
        run: npm test --if-present

      - name: Build
        env:
          # Build-time env stubs so Vite doesn't crash on missing vars in CI.
          # Real values come from Netlify/Vercel deploy environment.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-stub-key
          VITE_ADMIN_EMAILS: ci@example.com
        run: npm run build

      - name: Bundle-size budget check
        # Fails if any chunk crosses its gzipped budget defined in
        # scripts/check-bundle-size.mjs. Tighten the budget as we ship.
        run: node scripts/check-bundle-size.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
