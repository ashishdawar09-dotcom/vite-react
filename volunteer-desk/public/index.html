<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#06080D">
  <title>Check-in desk · Shuttle Storm</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/desk.css">
</head>
<body>
  <!-- Shown until the page knows whether the link works. -->
  <main id="gate" class="gate" aria-live="polite">
    <svg class="mark" viewBox="6 6 108 108" aria-hidden="true"><path d="M16 78 A46 46 0 0 1 50 15" fill="none" stroke="#829C28" stroke-width="5" stroke-linecap="round"/><path d="M104 42 A46 46 0 0 1 70 105" fill="none" stroke="#829C28" stroke-width="5" stroke-linecap="round"/><g transform="rotate(32 60 60)"><path d="M33 24 L87 24 L71 82 L49 82 Z" fill="none" stroke="#D4FF3A" stroke-width="5" stroke-linejoin="round"/><path d="M66 28 L50 56 L60 56 L53 79 L72 48 L62 48 L70 28 Z" fill="#D4FF3A"/><circle cx="60" cy="94" r="12" fill="#D4FF3A"/></g></svg>
    <h1 id="gate-title">Opening the desk…</h1>
    <p id="gate-text"></p>
    <button id="gate-retry" class="btn btn-primary" type="button" hidden>Try again</button>
  </main>

  <div id="app" hidden>
    <header class="top">
      <div class="top-row">
        <svg class="mark" viewBox="6 6 108 108" aria-hidden="true"><path d="M16 78 A46 46 0 0 1 50 15" fill="none" stroke="#829C28" stroke-width="5" stroke-linecap="round"/><path d="M104 42 A46 46 0 0 1 70 105" fill="none" stroke="#829C28" stroke-width="5" stroke-linecap="round"/><g transform="rotate(32 60 60)"><path d="M33 24 L87 24 L71 82 L49 82 Z" fill="none" stroke="#D4FF3A" stroke-width="5" stroke-linejoin="round"/><path d="M66 28 L50 56 L60 56 L53 79 L72 48 L62 48 L70 28 Z" fill="#D4FF3A"/><circle cx="60" cy="94" r="12" fill="#D4FF3A"/></g></svg>
        <div class="top-title">
          <strong>Check-in desk</strong>
          <span id="who"></span>
        </div>
        <div class="count" aria-live="polite"><b id="count-in">0</b><span id="count-of">of 0 in</span></div>
      </div>
      <div class="bar" aria-hidden="true"><i id="bar-fill"></i></div>
      <div class="tabs" role="tablist" aria-label="Desk">
        <button type="button" class="tab" id="tab-checkin" role="tab" aria-selected="true" aria-controls="view-checkin">Check-in</button>
        <button type="button" class="tab" id="tab-winners" role="tab" aria-selected="false" aria-controls="view-winners">Winners photos</button>
      </div>
      <div id="checkin-tools">
      <label class="search">
        <span class="sr">Search players by name</span>
        <input id="search" type="search" inputmode="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search a name…">
      </label>
      <div class="chips" role="group" aria-label="Show">
        <button type="button" class="chip" data-filter="todo" aria-pressed="true">To check in <b id="n-todo">0</b></button>
        <button type="button" class="chip" data-filter="nophoto" aria-pressed="false">No photo <b id="n-nophoto">0</b></button>
        <button type="button" class="chip" data-filter="all" aria-pressed="false">Everyone <b id="n-all">0</b></button>
      </div>
      </div>
      <p id="offline" class="offline" role="status" hidden>No connection. Changes will not save until it is back.</p>
    </header>

    <main>
      <div id="view-checkin" role="tabpanel" aria-labelledby="tab-checkin">
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" hidden></p>
      </div>
      <div id="view-winners" role="tabpanel" aria-labelledby="tab-winners" hidden>
        <p class="hint">One photo per event: the winners with their prizes. It shows in the live app and on the Shuttle Storm website.</p>
        <ul id="events" class="list"></ul>
        <p id="events-empty" class="empty" hidden></p>
      </div>
      <p class="foot">
        <span id="updated"></span>
        <button id="forget" type="button" class="link">Remove this link from this phone</button>
      </p>
    </main>
  </div>

  <!-- Photo: preview, the consent tick, then save. -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-name">
    <form method="dialog" id="sheet-form">
      <h2 id="sheet-name"></h2>
      <div class="preview"><img id="sheet-img" alt="The photo just taken"></div>
      <label class="consent">
        <input id="sheet-consent" type="checkbox">
        <span id="sheet-consent-text"></span>
      </label>
      <p id="sheet-error" class="error" role="alert" hidden></p>
      <div class="sheet-actions">
        <button id="sheet-save" class="btn btn-primary" type="button" disabled>Save photo</button>
        <button id="sheet-retake" class="btn" type="button">Retake</button>
        <button id="sheet-cancel" class="btn btn-quiet" type="button">Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" type="button" class="link" hidden>Undo</button>
  </div>

  <input id="camera" type="file" accept="image/*" capture="environment" hidden>

  <script src="/config.js"></script>
  <script src="/desk.js"></script>
</body>
</html>
