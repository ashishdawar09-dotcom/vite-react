<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Badminton Tournament — Live</title>

    <!-- PWA: install + standalone mode on iOS/Android -->
    <!-- theme-color matches the deep navy bg so iOS draws the status bar
         seamlessly into the header gradient (paired with the safe-area-inset
         top padding the header applies in App.tsx). -->
    <meta name="theme-color" content="#070F1F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Badminton" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS standalone-launch splash screens. Without these iOS shows a
         blank white flash before the SW + app shell load. Each PNG is
         rendered at native device pixel resolution by scripts/gen-pwa-icons.mjs;
         iOS picks the right one using the device-width/height + DPR media
         query. Covers iPhone XR through 17 Pro Max and modern iPads. -->
    <link rel="apple-touch-startup-image" href="/apple-splash-1290x2796.png"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1284x2778.png"
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1179x2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1242x2688.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-2048x2732.png"
          media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1668x2388.png"
          media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" />
    <!-- Fonts are now self-hosted via @fontsource-variable (see imports at
         the top of src/index.css). Vite bundles the variable woff2 files
         as static assets and they're served from the same Vercel origin
         as the rest of the app — no third-party DNS+TLS on the critical
         path. Saves ~700ms FCP on slow 4G vs. the previous Google Fonts
         <link rel="stylesheet">. -->

    <meta name="description" content="Live badminton tournament center — court-by-court scoring, group brackets, knockout stages, and shareable spectator views. Built for clubs running weekend tournaments." />

    <!-- Preconnect to the Supabase project so the first API round-trip
         (live_snapshot RPC for spectators, getSession for admins) doesn't
         pay the DNS+TCP+TLS cost in the critical path. Saves ~100-200ms
         on cold loads, more on mobile networks. crossorigin attribute is
         REQUIRED for fetch + CORS preconnects, otherwise the browser opens
         a separate non-CORS connection and the warmup is wasted. -->
    <link rel="preconnect" href="https://wdqooznwzesmjdvlcrxw.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://wdqooznwzesmjdvlcrxw.supabase.co" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
